# bank-agent-java private OpenAI settings - TEMPLATE ONLY (no real values).
#
# Copy to a private location OUTSIDE the repository and the OneDrive folder, then fill in real values:
#   mkdir -p ~/.config/bank-agent-java && chmod 700 ~/.config/bank-agent-java
#   cp config/application-secrets.example.properties ~/.config/bank-agent-java/application-secrets.properties
#   chmod 600 ~/.config/bank-agent-java/application-secrets.properties
# Another path can be used with BANK_AGENT_SECRETS_FILE=/path/to/file. Environment variables of the same
# name take precedence over this file.

# OpenAI official API key (source: splunk-ao-golden-demo .streamlit/secrets.toml -> openai_api_key).
OPENAI_API_KEY=<provided-locally-only>

# Default model: low-cost gpt-5-nano (validated for tool calling). Change here to switch models later.
OPENAI_MODEL=gpt-5-nano

# Official endpoint. Only change for an OpenAI-compatible gateway.
OPENAI_BASE_URL=https://api.openai.com/v1

# Optional. Reasoning effort for reasoning models such as gpt-5-nano (minimal|low|medium|high).
# Leave empty for non-reasoning models (e.g. gpt-4.1-mini). Default: low.
#OPENAI_REASONING_EFFORT=low
