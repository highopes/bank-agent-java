# bank-agent-java: agent observability backend (Splunk AO SaaS or Galileo) + Agent Control settings.
# TEMPLATE ONLY - no real values. Install the private copy outside the repository and the OneDrive folder:
#   mkdir -p ~/.config/bank-agent-java && chmod 700 ~/.config/bank-agent-java
#   cp config/galileo.example.properties ~/.config/bank-agent-java/galileo.properties
#   chmod 600 ~/.config/bank-agent-java/galileo.properties
# Then fill in section 1 for ONE backend option. Environment variables of the same name take precedence.
# Phase 1 code does not read this file; Phase 2 implements the derivation rules. Sources: docs/CONFIG-MAPPING.md

# ==============================================================================================
# 1. BACKEND AND CREDENTIALS - the only values a user has to provide
# ==============================================================================================
# Three backends are supported. Fill in the keys of ONE option (option A is the current default):
#
#   A. Splunk AO SaaS on Splunk Observability Cloud               profile "o11y"
#      Console: https://app.<realm>.observability.splunkcloud.com/
#      Fill:    AO_REALM, AO_O11Y_TOKEN
#   B. Galileo SaaS (legacy)                                        profile "galileo"
#      Console: https://app.galileo.ai/
#      Fill:    AO_API_KEY   (AO_CONSOLE_URL may stay empty: it defaults to https://app.galileo.ai)
#   C. Galileo multi-tenant cloud                                   profile "galileo"
#      Console: https://console.multitenant.galileocloud.io/<tenant>   (e.g. tenant "splunkse")
#      Fill:    AO_API_KEY, AO_CONSOLE_URL=https://console.multitenant.galileocloud.io
#      Use the console ROOT only: the /<tenant> path is the browser login entry, never part of API URLs.
#
# To switch backend: fill in the new option's keys and set AO_BACKEND_PROFILE (section 3) to o11y or galileo.
# The other option's values may stay in the file; they are ignored once the profile is set explicitly.
# Keep the section 3 keys empty: endpoints and header names then follow the profile automatically.
# The Project / Agent Stream of section 2 are created on the new backend automatically.

# ---- Option A: o11y ----
# Splunk Observability Cloud realm: the <realm> in https://app.<realm>.observability.splunkcloud.com/
# (official SDK env SPLUNK_AO_REALM; also shown in My Profile > Organizations).
AO_REALM=<your-realm, e.g. us1 or au0>
# SECRET. Splunk Observability Cloud access token (official SDK env SPLUNK_AO_O11Y_TOKEN). An O11y admin
# creates it in Settings > Access tokens with [x] INGEST token and [x] API token (role
# agent_observability_admin). Sent as the "X-SF-Token" header for OTLP export, the AO REST API and
# Agent Control. A Galileo API key is NOT valid for this option.
AO_O11Y_TOKEN=<stored-only-in-private-local-file>

# ---- Options B and C: galileo ----
# Console root URL.
#   o11y:    leave empty (derived: https://app.${AO_REALM}.observability.splunkcloud.com/).
#   galileo: empty = https://app.galileo.ai (option B; Galileo SDK default). Option C needs
#            https://console.multitenant.galileocloud.io
AO_CONSOLE_URL=
# SECRET. Galileo API key (Galileo console > user menu > API keys). Sent as the "Galileo-API-Key" header
# for OTLP export, the Galileo REST API and Agent Control. Not valid for option A.
# The golden demo's galileo_api_key is an option C key (tenant splunkse).
AO_API_KEY=

# ==============================================================================================
# 2. SWITCHES AND NAMES - ready-to-use defaults; change only when needed
# ==============================================================================================
# OpenTelemetry export. Keep false until Phase 2 P0 gate O1 passes.
OBSERVABILITY_ENABLED=false
# Agent Control: off | remote-api. Independent of OBSERVABILITY_ENABLED. Keep off until P0 gates C1/C2 pass.
CONTROL_MODE=off
# Opt-in: send fictional demo input/output text to the backend (still filtered and truncated).
DEMO_TRACE_CONTENT=false
# Project and Agent Stream (Galileo: Log Stream) names, case-sensitive, isolated from the golden demo.
# No IDs are configured: at startup the application looks both up by name through the REST API of the
# active backend, creates them when missing, and keeps the resolved UUIDs in memory (same behaviour as
# the official SDK loggers).
AO_PROJECT_NAME=bank-agent-java
AO_AGENT_STREAM=bank-java-demo

# ==============================================================================================
# 3. OPTIONAL OVERRIDES - leave EMPTY; empty means "use the derived default of the active profile"
#    shown above each key. Only set a value to override the rule (e.g. a proxy or a dedicated env).
#    o11y rules:    official Splunk AO docs and splunk-ao-python SDK.
#    galileo rules: official Galileo docs and the galileo / galileo-core Python SDK.
# ==============================================================================================
# o11y | galileo. Empty = auto-detect: "o11y" when only option A credentials (AO_REALM / AO_O11Y_TOKEN)
# are set, "galileo" when only AO_API_KEY is set. If both are filled in, set it explicitly (startup fails
# as ambiguous otherwise). The golden demo value "splunkse" is a tenant name, not a profile.
AO_BACKEND_PROFILE=
# Empty = o11y:    https://app.${AO_REALM}.observability.splunkcloud.com/ao/api/
#                  (SDK O11yApiClient: app host + /ao/api prefix + X-SF-Token, no JWT exchange. The My Profile
#                  "API Endpoint" https://api.${AO_REALM}.observability.splunkcloud.com is the general O11y
#                  REST API (/v2/...); it also proxies /ao/api/, but the app host matches the official SDK.)
#         galileo: https://api.galileo.ai for app.galileo.ai, otherwise AO_CONSOLE_URL with "console"
#                  replaced by "api", e.g. https://api.multitenant.galileocloud.io (galileo-core set_api_url).
AO_API_URL=
# SECRET, optional, o11y only. Dedicated API/CRUD token (SDK env SPLUNK_AO_O11Y_API_TOKEN).
# Empty = AO_O11Y_TOKEN.
AO_O11Y_API_TOKEN=
# Empty = o11y:    https://ingest.${AO_REALM}.observability.splunkcloud.com/v2/trace/otlp (SDK deployment.py)
#         galileo: ${AO_API_URL}/otel/traces, e.g. https://api.galileo.ai/otel/traces (Galileo OTel docs)
#         Neither is the standard OTLP /v1/traces path.
AO_OTLP_ENDPOINT=
# Empty = o11y: X-SF-Token (value AO_O11Y_TOKEN); galileo: Galileo-API-Key (value AO_API_KEY).
AO_OTLP_AUTH_HEADER=
# Empty = bank-agent-java (spring.application.name).
OTEL_SERVICE_NAME=
# Empty = o11y:    https://app.${AO_REALM}.observability.splunkcloud.com/ao/agent-control
#                  (official SaaS pattern https://<realm-host>/ao/agent-control)
#         galileo: ${AO_CONSOLE_URL}/api/agent-control, e.g. https://app.galileo.ai/api/agent-control or
#                  https://console.multitenant.galileocloud.io/api/agent-control (used by the golden demo).
#         Dedicated Galileo environments may publish https://agent-control.<env>.galileo.ai; set it here then.
AGENT_CONTROL_URL=
# Empty = the evaluation route verified in Phase 2 P0 and built into the application as its default.
AGENT_CONTROL_EVALUATION_PATH=
# Empty = o11y: X-SF-Token; galileo: Galileo-API-Key. This is a header NAME, not a credential.
AGENT_CONTROL_API_KEY_HEADER=
# SECRET, optional. Only if a separate Agent Control credential is issued.
# Empty = the profile credential (o11y: AO_O11Y_TOKEN; galileo: AO_API_KEY).
AGENT_CONTROL_API_KEY=
# Empty = bank-agent-java. If Agent Control requires agent registration, the application registers or
# looks up this name automatically at startup.
AGENT_CONTROL_AGENT_NAME=
# Empty = log_stream (official docs and SDKs of both backends). The target ID is intentionally NOT
# configurable: it is the Agent Stream UUID resolved at startup from AO_PROJECT_NAME / AO_AGENT_STREAM.
AGENT_CONTROL_TARGET_TYPE=
# Empty = jwt / X-Agent-Control-Runtime-Token (official SDK flow on both backends). Whether the Java client
# needs the runtime-token exchange is decided in P0; if needed the application performs it automatically.
AGENT_CONTROL_RUNTIME_AUTH_MODE=
AGENT_CONTROL_RUNTIME_TOKEN_HEADER=
# Behaviour when Agent Control is unavailable (timeout/5xx/auth error), which is not a Control DENY.
# Empty = fail-open for read-only steps, fail-closed for write steps.
CONTROL_READ_FAILURE_MODE=
CONTROL_WRITE_FAILURE_MODE=
# Empty = 2 (bounded STEER retries; never retries non-idempotent writes).
MAX_CONTROL_STEER_RETRIES=
