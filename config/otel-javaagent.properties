# Settings of the official OpenTelemetry Java agent for this demo (no secrets; standard otel.* keys).
# scripts/run.sh --observe passes this file with -Dotel.javaagent.configuration-file=... and adds, as standard
# OTEL_* environment variables derived from the private galileo.properties, the AO-specific values:
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT   https://ingest.<realm>.observability.splunkcloud.com/v2/trace/otlp
#   OTEL_EXPORTER_OTLP_TRACES_HEADERS    X-SF-Token=<token>,project=<project>,logstream=<agent stream>
#   OTEL_RESOURCE_ATTRIBUTES             splunk_ao.project.name=...,splunk_ao.logstream.name=...
#   OTEL_SERVICE_NAME                    bank-agent-java
# Environment variables and -D system properties take precedence over this file.
# Reference: https://opentelemetry.io/docs/zero-code/java/agent/configuration/

# Splunk AO accepts traces only: no metrics and no log export.
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
otel.exporter.otlp.traces.protocol=http/protobuf

# Kept automatic instrumentation: Tomcat / Spring Web MVC - one SERVER span per HTTP request (route, status,
# latency), the root of every trace; context propagation; the OTLP exporter, batching and resource.

# Disabled because they would only duplicate what another span already shows:
# - java-http-client: the OpenAI round trip is already the GenAI "chat" span (LangChain4j listener); the raw
#   HTTP POST below it, and the Agent Control / AO REST calls, would be extra non-AI spans in AO.
otel.instrumentation.java-http-client.enabled=false
# - spring-data and hibernate: one repository call would otherwise produce three nested spans
#   (Repository -> Hibernate Session -> JDBC).
otel.instrumentation.spring-data.enabled=false
otel.instrumentation.hibernate.enabled=false
# JDBC works (verified: sanitized SQL spans nest under the tool that ran them) but is off in this demo:
# - schema creation and demo-data seeding at startup run outside any request, so every statement becomes its own
#   trace (dozens of non-AI traces per start; the agent cannot "record only with a parent");
# - with the embedded H2 file database the span name and db.namespace contain the local file path (user name).
# With a server database (PostgreSQL, Oracle, ...) remove this line or set OTEL_INSTRUMENTATION_JDBC_ENABLED=true.
otel.instrumentation.jdbc.enabled=false
otel.instrumentation.common.db-statement-sanitizer.enabled=true
