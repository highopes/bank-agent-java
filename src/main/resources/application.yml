# Application configuration. Secrets are NOT stored here: they are imported from private files outside
# the repository (default ~/.config/bank-agent-java/application-secrets.properties for OpenAI and
# ~/.config/bank-agent-java/galileo.properties for the Galileo instrumentation: Observe / Agent Control) or from environment
# variables, which take precedence. Observe itself (export to Splunk AO) is done by the OpenTelemetry Java agent that
# scripts/run.sh --observe attaches; it is configured with standard OTEL_* settings, not in this file.
spring:
  application:
    name: bank-agent-java
  config:
    import:
      - "optional:file:${BANK_AGENT_SECRETS_FILE:${user.home}/.config/bank-agent-java/application-secrets.properties}"
      - "optional:file:${BANK_AGENT_GALILEO_FILE:${user.home}/.config/bank-agent-java/galileo.properties}"
  datasource:
    # File-based H2 kept outside the (OneDrive-synced) project folder to avoid sync and lock issues.
    url: "jdbc:h2:file:${BANK_AGENT_DATA_DIR:${user.home}/.local/share/bank-agent-java}/h2/bankagent;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
  h2:
    console:
      enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true
    default-property-inclusion: non_null
  thymeleaf:
    cache: true
  threads:
    virtual:
      enabled: false

server:
  # Bind to loopback only by default; override with BANK_AGENT_HOST / BANK_AGENT_PORT if needed.
  address: ${BANK_AGENT_HOST:127.0.0.1}
  port: ${BANK_AGENT_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

bank-agent:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    # Low-cost default model. Change OPENAI_MODEL in the private secrets file to switch models.
    model: ${OPENAI_MODEL:gpt-5-nano}
    # GPT-5 family reasoning effort (minimal | low | medium | high). Set to empty for non-reasoning models.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:4096}
    timeout: ${OPENAI_TIMEOUT:90s}
    max-retries: ${OPENAI_MAX_RETRIES:1}
    # Full request/response logging stays off by default (cost, privacy, log size).
    log-requests: false
    log-responses: false
  agent:
    max-tool-invocations: 6
    memory-max-messages: 20
    max-message-length: 1000
    router-history-turns: 8
    max-route-steps: 3
    conversation-ttl: 2h
    max-conversations: 500
  payments:
    single-transfer-limit: "50000.00"
    draft-ttl: 10m
    currency: CNY
  demo:
    customer-id: CUST-DEMO-001
    time-zone: Asia/Shanghai
  # ---------------------------------------------------------------------------------------------------------
  # Galileo instrumentation user settings (private galileo.properties or same-named environment variables). Raw strings only:
  # an EMPTY value means "derive from the active profile" (see AoEndpointResolver and docs/CONFIG-MAPPING.md).
  # Switches default to off: no validation and no network calls until OBSERVABILITY_ENABLED / CONTROL_MODE are set.
  # ---------------------------------------------------------------------------------------------------------
  ao:
    observability-enabled: ${OBSERVABILITY_ENABLED:false}
    control-mode: ${CONTROL_MODE:off}
    demo-trace-content: ${DEMO_TRACE_CONTENT:false}
    realm: ${AO_REALM:}
    o11y-token: ${AO_O11Y_TOKEN:}
    console-url: ${AO_CONSOLE_URL:}
    api-key: ${AO_API_KEY:}
    project-name: ${AO_PROJECT_NAME:}
    agent-stream: ${AO_AGENT_STREAM:}
    backend-profile: ${AO_BACKEND_PROFILE:}
    api-url: ${AO_API_URL:}
    o11y-api-token: ${AO_O11Y_API_TOKEN:}
    otlp-endpoint: ${AO_OTLP_ENDPOINT:}
    otlp-auth-header: ${AO_OTLP_AUTH_HEADER:}
    service-name: ${OTEL_SERVICE_NAME:}
    agent-control-url: ${AGENT_CONTROL_URL:}
    agent-control-evaluation-path: ${AGENT_CONTROL_EVALUATION_PATH:}
    agent-control-api-key-header: ${AGENT_CONTROL_API_KEY_HEADER:}
    agent-control-api-key: ${AGENT_CONTROL_API_KEY:}
    agent-control-agent-name: ${AGENT_CONTROL_AGENT_NAME:}
    agent-control-target-type: ${AGENT_CONTROL_TARGET_TYPE:}
    agent-control-runtime-auth-mode: ${AGENT_CONTROL_RUNTIME_AUTH_MODE:}
    agent-control-runtime-token-header: ${AGENT_CONTROL_RUNTIME_TOKEN_HEADER:}
    control-read-failure-mode: ${CONTROL_READ_FAILURE_MODE:}
    control-write-failure-mode: ${CONTROL_WRITE_FAILURE_MODE:}
    max-control-steer-retries: ${MAX_CONTROL_STEER_RETRIES:}
  # Non-secret tuning of the application's Observe helpers. Export, batching and sampling are settings of the
  # OpenTelemetry Java agent (config/otel-javaagent.properties, OTEL_* variables), not of the application.
  observability:
    service-version: "@project.version@"
    max-content-chars: 2000
    api-timeout: 10s
    api-max-attempts: 3
  # Non-secret Agent Control client tuning. Evaluation is synchronous and on the request path.
  control:
    connect-timeout: 3s
    request-timeout: 5s
    evaluation-attempts: 2
    token-refresh-margin: 30s
    # Bound controls are re-read at most this often to skip steps no control applies to (official SDK behaviour);
    # a Console change therefore takes effect within this interval, without a restart.
    controls-refresh-interval: 5s
    prefilter: true
    startup-attempts: 3

logging:
  level:
    root: INFO
    com.demo.bankagent: INFO
    dev.langchain4j: WARN
